    <script>
      try {
        const t = localStorage.getItem('mathestra:theme');
        if (t) document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body class="page">
    <!-- brand-sprite -->
    <header class="page-nav">
      <a class="brand" href="/" aria-label="Mathestra home">

        <span>Mathestra</span>

      <div class="page-nav-actions">
        <button class="icon-btn" id="theme-btn" aria-label="Switch theme" title="Switch theme">

        </button>
      </div>
    </header>

    <main class="lost">
      <figure class="lost-screen" aria-hidden="true">
        <svg viewBox="0 0 480 200" preserveAspectRatio="none">
          <g class="grid">
            <line x1="60" y1="0" x2="60" y2="200" /><line x1="120" y1="0" x2="120" y2="200" /><line x1="180" y1="0" x2="180" y2="200" />

          </g>
          <line class="flat" x1="0" y1="100" x2="480" y2="100" />
        </svg>
        <span class="lost-eq"><i>y</i> = 0 · sin(2π · 404<i>x</i>)</span>
      </figure>
      <p class="lost-code">Error 404</p>
      <h1>This page is silent.</h1>
      <p class="lede-404">There is nothing at this address. It may have been mistyped, or the page may have moved.</p>
      <div class="lost-actions">
        <a class="btn ghost big" href="/">Go to the home page</a>
        <a class="btn solid big" href="/app/">Open the calculator</a>
      </div>
    </main>

    <footer class="page-foot">

      <nav aria-label="Footer">
